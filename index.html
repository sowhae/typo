<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Typography Sandbox</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="container">
        <!-- Main canvas for typography -->
        <canvas id="canvas"></canvas>

        <!-- Hidden video element for webcam -->
        <video id="video" autoplay playsinline style="display: none;"></video>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="gesture-indicators">
                <div class="gesture-indicator" id="left-hand-indicator">
                    <span class="gesture-name">-</span>
                </div>
                <div class="gesture-indicator" id="right-hand-indicator">
                    <span class="gesture-name">-</span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
